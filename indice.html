<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ley de Amdhal</title>
    <link rel="stylesheet" href="style.css"></link>
</head>
<body>
    <header id="header-ley"> Ley de Amdahl</header>
    <section id="banner" style="background-color: #D21116">
    </section>
        <div>
        </div>
        
    <section id="seccion-partes">
        <div id="seccion-unica-mejora"> Calcular el nuevo tiempo de ejecucion 
            <div id="caja-1-mejora" style="font-size: 24px"> TEn = TEa x [( 1 - fm ) + fm/speedup]</div>
            <form id="formulario-1-mejora">
                <div> </div>
                <label> Tiempo Antiguo (TEa)</label>
                <input type="text" id="input-ta-1-mejora">
                <label> Fracción mejorada (fm)</label>
                <input type="text" id="input-fm-1-mejora">
                <label> Speedup</label>
                <input type="text" id="input-speedup-1-mejora">
                <button type="submit" id="boton-enviar-1-mejora">Calcular</button>
                <button type="reset" id="boton-reset-1-mejora">Resetear</button>
            </form>
        </div>
        <div id="seccion-multiple-mejora"> Ambas partes pueden mejorar/empeorar
            <label for="selector-mejora"> Cantidad de mejoras
            <select id="selector-mejora">
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>

            <div id="caja-multiple-mejora">
                
            <div id="barra-total" style="width: 100%; height: 35px; background-color: #e0e0e0; display: flex; border-radius: 5px; overflow: hidden; border: 1px solid #ccc;"> 
            </div>
            <p id="texto-resultado" style="margin-top: 10px;"></p>
            </div>
            <form id="formulario-multiple-mejora">
                <div id="contenedor-elecciones"></div>
                <button type="submit" id="boton-enviar-multiple-mejora">Calcular</button>
                <button type="reset" id="boton-reset-multiple-mejora">Resetear</button>
            </form>
        </div>
    </section>
    <footer id="footer-autor">
    Desarrollado por <b>Cesar Hernan Salas Peñaranda</b> & <b>Juan Camilo Duran Bohorquez</b> · Ley de Amdahl
    </footer>
     <script src="code.js"> </script>
</body>
</html>
